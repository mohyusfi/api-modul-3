info:
  name: "1. Endpoint Tidak Dikenal - 404"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/endpoint_fiktif"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
  scripts:
    - type: tests
      code: |
        test("Status code is 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
        });
        test("Error endpoint tidak ditemukan", function() {
          const body = res.getBody();
          expect(body.error).to.equal('Endpoint tidak ditemukan');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
