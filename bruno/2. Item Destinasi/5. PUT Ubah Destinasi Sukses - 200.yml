info:
  name: "5. PUT Ubah Destinasi Sukses - 200"
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/destinations/{{existingId}}"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "fullname": "Ahmad Dahlan (Updated by Bruno)",
        "email": "ahmad.updated@example.com",
        "address": "Jl. Tadulako No. 12, Palu",
        "phone_number": "081234567801",
        "gender": "male",
        "status": "inactive"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.fullname
      operator: eq
      value: "Ahmad Dahlan (Updated by Bruno)"
  scripts:
    - type: tests
      code: |
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("User berhasil diupdate", function() {
          const body = res.getBody();
          expect(body.id).to.equal(1);
          expect(body.fullname).to.equal("Ahmad Dahlan (Updated by Bruno)");
          expect(body.status).to.equal("inactive");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
