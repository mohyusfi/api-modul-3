info:
  name: "7. PUT Field Wajib Hilang - 400"
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/destinations/{{existingId}}"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "fullname": "Hanya Fullname Saja"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |
        test("Status code is 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
        });
        test("Validasi field wajib gagal", function() {
          const body = res.getBody();
          expect(body.error).to.include('Field wajib belum diisi');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
