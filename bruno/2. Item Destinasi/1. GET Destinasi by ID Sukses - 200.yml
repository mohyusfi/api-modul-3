info:
  name: "1. GET Destinasi by ID Sukses - 200"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/destinations/{{existingId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "1"
  scripts:
    - type: tests
      code: |
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Item memiliki struktur data lengkap", function() {
          const body = res.getBody();
          expect(body.id).to.equal(1);
          expect(body).to.have.property('name');
          expect(body).to.have.property('region');
          expect(body).to.have.property('category');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
