info:
  name: "1. GET Destinasi by ID Sukses - 200"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/destinations/{{existingId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "1"
  scripts:
    - type: tests
      code: |
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Item memiliki struktur data lengkap", function() {
          const body = res.getBody();
          expect(body.id).to.equal(1);
          expect(body).to.have.property('fullname');
          expect(body).to.have.property('email');
          expect(body).to.have.property('address');
          expect(body).to.have.property('phone_number');
          expect(body).to.have.property('gender');
          expect(body).to.have.property('status');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
