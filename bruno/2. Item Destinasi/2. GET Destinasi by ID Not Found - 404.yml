info:
  name: "2. GET Destinasi by ID Not Found - 404"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/destinations/{{nonExistentId}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
  scripts:
    - type: tests
      code: |
        test("Status code is 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
        });
        test("Pesan error item tidak ditemukan", function() {
          const body = res.getBody();
          expect(body.error).to.include('tidak ditemukan');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
