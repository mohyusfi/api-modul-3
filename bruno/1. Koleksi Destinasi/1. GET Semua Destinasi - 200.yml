info:
  name: "1. GET Semua Destinasi - 200"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/destinations"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: gt
      value: "0"
  scripts:
    - type: tests
      code: |
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Response adalah array berisi objek destinasi", function() {
          const body = res.getBody();
          expect(Array.isArray(body)).to.be.true;
          expect(body.length).to.be.above(0);
          expect(body[0]).to.have.property('id');
          expect(body[0]).to.have.property('name');
          expect(body[0]).to.have.property('region');
          expect(body[0]).to.have.property('category');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
