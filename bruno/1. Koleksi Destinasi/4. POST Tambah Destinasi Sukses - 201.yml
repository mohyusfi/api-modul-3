info:
  name: "4. POST Tambah Destinasi Sukses - 201"
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/destinations"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "fullname": "Bambang Pamungkas",
        "email": "bambang.pamungkas@example.com",
        "address": "Jl. Mawar No. 15, Palu",
        "phone_number": "081234567899",
        "gender": "male",
        "status": "active"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.fullname
      operator: eq
      value: "Bambang Pamungkas"
  scripts:
    - type: tests
      code: |
        test("Status code is 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });
        test("Item berhasil ditambahkan dengan id baru", function() {
          const body = res.getBody();
          expect(body).to.have.property('id');
          expect(body.fullname).to.equal("Bambang Pamungkas");
          expect(body.email).to.equal("bambang.pamungkas@example.com");
          expect(body.address).to.equal("Jl. Mawar No. 15, Palu");
          expect(body.phone_number).to.equal("081234567899");
          expect(body.gender).to.equal("male");
          expect(body.status).to.equal("active");
          bru.setVar('createdId', body.id);
        });
        test("Header Location dikembalikan dengan format yang benar", function() {
          const loc = res.getHeader('location');
          expect(loc).to.include('/destinations/');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
