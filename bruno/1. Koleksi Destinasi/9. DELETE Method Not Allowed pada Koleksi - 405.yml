info:
  name: "9. DELETE Method Not Allowed pada Koleksi - 405"
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/destinations"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "405"
  scripts:
    - type: tests
      code: |
        test("Status code is 405 Method Not Allowed", function() {
          expect(res.getStatus()).to.equal(405);
        });
        test("Header Allow dikembalikan", function() {
          expect(res.getHeader('allow')).to.include('GET, POST');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
