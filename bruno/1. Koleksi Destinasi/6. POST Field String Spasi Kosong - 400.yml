info:
  name: "6. POST Field String Spasi Kosong - 400"
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/destinations"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "fullname": "   ",
        "email": "user@example.com",
        "address": "Palu",
        "phone_number": "081234567899",
        "gender": "male",
        "status": ""
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |
        test("Status code is 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
        });
        test("Field berisi spasi dianggap kosong", function() {
          const body = res.getBody();
          expect(body).to.have.property('error');
          expect(body.error).to.include('fullname');
          expect(body.error).to.include('status');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
