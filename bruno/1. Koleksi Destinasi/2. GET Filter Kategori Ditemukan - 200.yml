info:
  name: "2. GET Filter Kategori Ditemukan - 200"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/destinations"
  params:
    - name: category
      value: "pantai"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |
        test("Status code is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });
        test("Semua item memiliki category 'pantai'", function() {
          const body = res.getBody();
          expect(Array.isArray(body)).to.be.true;
          body.forEach(item => {
            expect(item.category).to.equal('pantai');
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
